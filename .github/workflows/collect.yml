name: collect-market-data
on:
  schedule:
    - cron: "27 * * * *"     # every hour at minute 17 (UTC)
  workflow_dispatch:          # run by hand from the Actions tab
    inputs:
      test_alert:
        description: "Send a test alert issue (set to 1)"
        required: false
        default: "0"
permissions:
  contents: write
  issues: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FORCE_TEST_ALERT: ${{ github.event.inputs.test_alert }}
        run: python collect.py
      - name: Commit data
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push || (git pull --rebase origin main && git push)
      - name: Open alert issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f alert_message.md ]; then
            gh issue create --title "Market alert $(date -u +%Y-%m-%dT%H:%MZ)" --body-file alert_message.md
          fi
