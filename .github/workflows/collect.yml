name: collect-market-data
on:
  schedule:
    - cron: "7 * * * *"      # every hour at minute 7 (UTC)
  workflow_dispatch: {}       # lets you run it by hand from the Actions tab
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python collect.py
      - name: Commit data
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
