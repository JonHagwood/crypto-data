name: hourly-trigger
# Fresh schedule-only workflow. Every 10 minutes while we test; when confirmed it will be changed to hourly.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
permissions:
  actions: write
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Report time
        run: date -u
